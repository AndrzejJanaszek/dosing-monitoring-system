[engine]
tick_interval_s = 1.0
max_reading_age_s = 1.0
max_signal_age_s = 1.0

[temperatures]
record_interval_s = 1.0
max_reading_age_s = 5.0
min_valid_c = -40.0
max_valid_c = 80.0

# Estimation methods give every event that collided with another event of its silo a theoretical
# value, stored in dms.event_estimate. mean_rate: the mean dispense rate of the last n clean
# dispenses of the tank (default n = 10). The example uses n = 3, so that short simulator
# scenarios already give values.
[[estimation_methods]]
method = "mean_rate"
n = 3

[[meters]]
id = "meter-1"
port = "/tmp/dms/meter-1"
baudrate = 9600
format = "dgtp"
frame_start = ""
frame_end = "\r\n"
reconnect_delay_s = 5.0
silence_timeout_s = 5.0

[board]
id = "arduino"
port = "/tmp/dms/arduino"
baudrate = 9600
frame_start = ""
frame_end = "\r\n"
reconnect_delay_s = 5.0
silence_timeout_s = 5.0

[[silos]]
id = 1
name = "Silos 1"
meter_id = "meter-1"

# A tank id is never reused for another tank, and a tank never moves to another silo:
# startup is refused if the database knows the tank under a different silo.
[[tanks]]
id = 1
name = "Zbiornik 1"
silo_id = 1
dispense = { pin = 4, active_level = 0 }
refill = { pin = 5, active_level = 0 }

# A temperature sensor id is never reused for another sensor, and a sensor never changes its silo
# or leg (nor moves between a silo and the ambient): startup is refused if the database knows
# the sensor differently. Filling an empty leg and changing name or address are allowed.
# Without silo_id the sensor measures the ambient temperature.
[[temperature_sensors]]
id = 1
name = "Czujnik 1"
address = "28A8F126AB240B1C"
silo_id = 1
leg = 1

[[temperature_sensors]]
id = 2
name = "Czujnik 2"
address = "28FF4A7C61160398"
silo_id = 1
leg = 2
