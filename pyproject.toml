[project]
name = "dms"
version = "0.1.0"
description = "Dosing monitoring system for a concrete batching plant"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pyserial>=3.5",
    "structlog>=26.1.0",
]

[project.scripts]
dms-acquisition = "dms.acquisition.main:main"
dms-migrate = "dms.persistence.migrate:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "testcontainers>=4.15.0",
    "types-pyserial>=3.5.0.20260712",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["E501"]

[tool.ruff.lint.pylint]
max-args = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: fast tests without I/O",
    "integration: tests against real external resources such as PostgreSQL",
    "e2e: the acquisition service run as a process",
]
